name: Build Geopackage
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository contents
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        run: |
            docker run \
            -e WORKING_DIR="$PWD" \
            -v $PWD:$PWD alpine:edge $PWD/.github/workflows/build_alpine.sh

  # The suite is the only thing that keeps the regression tests honest, so it runs on
  # every pull request rather than only on demand.
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository contents
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure and build with tests enabled
        run: |
          cmake --preset test
          cmake --build --preset test -j"$(nproc)"

      - name: Run the test suite
        run: ctest --preset test

  # Several fixed defects — leaked geometries, out-of-bounds reads, signed-shift overflow —
  # are invisible to a plain build and only show up under the sanitizers, so the same suite
  # runs a second time with them enabled.
  sanitizers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository contents
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure and build with AddressSanitizer and UndefinedBehaviorSanitizer
        run: |
          cmake -S . -B build-sanitizers -DGPKG_TEST=ON -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-sanitizers -j"$(nproc)"

      - name: Run the test suite under the sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build-sanitizers --output-on-failure